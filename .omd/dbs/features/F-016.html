  <main class="omd-doc-body">
    <h2>동작</h2>
    <p>두 종류의 예외를 자동으로 추린다.</p>
    <ul>
    <li><strong>헛돈 훅</strong> — 조회는 높은데 유지율이 하위권</li>
    <li><strong>숨은 체인</strong> — 조회는 낮은데 유지율이 상위권</li>
    </ul>
    <h2>수용 기준</h2>
    <ul>
    <li>기준이 백분위수로 명시된다</li>
    <li>거기서 바로 체인 상세로 간다</li>
    <li>표본이 적은 구간은 경고한다</li>
    </ul>
